<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <span class="title">History</span>
    <div class="header-actions">
      <!-- Clear data icon -->
      <button class="action-btn" id="btn-clear-data" title="Clear browsing data">
        <svg viewBox="0 0 16 16" width="16" height="16">
          <path fill="currentColor" d="M5.5 1v1h5V1h-5zM3 3h10v1H3V3zm1 2h8v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5zm2 1v7h1V6H6zm3 0v7h1V6H9z"/>
        </svg>
      </button>
      <!-- More options icon -->
      <button class="action-btn" id="btn-more-options" title="More options">
        <svg viewBox="0 0 16 16" width="16" height="16">
          <circle fill="currentColor" cx="3" cy="8" r="1.5"/>
          <circle fill="currentColor" cx="8" cy="8" r="1.5"/>
          <circle fill="currentColor" cx="13" cy="8" r="1.5"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- More Options Dropdown Menu (Hidden by default) -->
  <div class="dropdown-menu hidden" id="more-dropdown">
    <div class="dropdown-item" id="menu-open-page">Open history page</div>
    <div class="dropdown-item" id="menu-clear-all">Clear all history list</div>
  </div>

  <!-- Search Area -->
  <div class="search-container">
    <svg class="search-icon" viewBox="0 0 16 16" width="14" height="14">
      <path fill="currentColor" d="M11.74 10.68a5 5 0 1 0-1.06 1.06l3.52 3.52a.75.75 0 1 0 1.06-1.06l-3.52-3.52zM11 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0z"/>
    </svg>
    <input type="text" id="search-input" placeholder="Search history" autocomplete="off" autofocus>
    <button class="clear-search hidden" id="clear-search-btn">
      <svg viewBox="0 0 16 16" width="10" height="10">
        <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M3 3l10 10M13 3L3 10M3 3l10 10m0-10L3 13"/>
      </svg>
    </button>
  </div>

  <!-- Tabs Navigation -->
  <div class="tabs-container">
    <div class="tabs">
      <div class="tab active" id="tab-all">All</div>
      <div class="tab" id="tab-closed">Recently closed</div>
    </div>
    <div class="tab-indicator"></div>
  </div>

  <!-- History Items List -->
  <div class="list-wrapper">
    <ul class="history-list" id="history-list">
      <!-- Generated via JS -->
    </ul>
    
    <!-- Empty State -->
    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="48" height="48">
          <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 8v5M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="empty-text">No history found</div>
    </div>
  </div>

  <template id="history-row-template">
    <li class="history-item">
      <div class="item-icon" data-role="item-icon">
        <img alt="">
      </div>
      <span class="item-title" data-role="item-title"></span>
      <span class="item-time" data-role="item-time"></span>
      <button class="item-delete" data-action="delete-history" title="Remove from history">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M4 4l12 12M16 4L4 16"/>
        </svg>
      </button>
    </li>
  </template>

  <script src="popup.js"></script>
</body>
</html>
